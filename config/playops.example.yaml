# PlayOps example configuration.
# Copy to config/playops.yaml and fill in local values.
# config/playops.yaml is git-ignored. NEVER commit credentials.

# Google Play target application.
google_play:
  package_name: "com.example.app" # Android package name
  service_account_json: "" # Absolute path to service-account JSON (outside repo)

# Agent runtime (Phase 2).
agent:
  max_steps: 20 # Agent loop step guard
  approval_timeout_seconds: 300 # CLI approval prompt timeout

# App health thresholds (Phase 5.4). All rules disabled by default.
# Null or omitted = disabled. Active thresholds MUST be quoted exact decimal strings.
# Use the exact Reporting API Decimal numeric scale: NO automatic percentage/fraction
# conversion. The API describes percentages of distinct users, but PlayOps does not
# infer a numeric conversion factor from that wording. There is no recommended value.
# Syntax only (not a recommendation): crash_rate_reported_threshold: "0.01"
# Legacy numeric session-fraction threshold keys and their legacy env names are retired:
# explicit legacy configuration fails with a migration error and is never converted,
# silently preserved, or reinterpreted. There is no backward-compatible numeric setting.
# Env overrides use PLAYOPS_HEALTH_{CRASH_RATE,ANR_RATE,EXCESSIVE_WAKEUP_RATE}_REPORTED_THRESHOLD.
# Absent env = no override; present env must be an exact non-negative decimal string;
# blank env is invalid (there is no string "null" env disable sentinel).
health:
  crash_rate_reported_threshold: null
  anr_rate_reported_threshold: null
  excessive_wakeup_rate_reported_threshold: null

# Structured operational diagnostics (Phase 6.2), NOT the audit log.
# Minimum severity: debug < info < warn < error; default info.
# CLI diagnostics go to stderr, never report stdout. Env: PLAYOPS_LOGGING_LEVEL.
logging:
  level: info

# Audit log (Phase 0.6).
audit:
  log_path: "./logs/playops.audit.jsonl" # Append-only JSONL audit log

# Review Agent (Phase 3.5).
review:
  checkpoint_path: "./data/reviews/checkpoint.json" # Ingestion state persistence

# Release Agent (Phase 4.2).
release:
  edit_session_path: "./data/releases/edit-session.json" # Locally tracked Play edit session
  edit_cleanup_journal_path: "./data/releases/edit-cleanup-journal.json" # Phase 4.15 known edit records

# LLM provider (Phase 3.5).
llm:
  nine_router:
    base_url: "http://127.0.0.1:20128/v1" # OpenAI-compatible endpoint
    model: "gpt-4o-mini" # Opaque model identifier
    # api_key: "" # Optional; set via PLAYOPS_LLM_9ROUTER_API_KEY env var
