# PlayOps tmpfiles.d — the state-directory ownership split.
#
# Two authorities own the PlayOps tree and they must not overlap, one
# provisioning authority per path:
#
#   * systemd owns the /run/playops, /var/lib/playops and /var/log/playops ROOTS
#     through RuntimeDirectory=, StateDirectory= and LogsDirectory= in
#     deploy/systemd/playops.service (modes 0750, 0700, 0700; user playops).
#     Those roots stay systemd-owned and MUST NOT be duplicated here.
#   * THIS file owns ONLY the four nested directories below, which the systemd
#     directory directives do not cover: the three 0700 state directories and
#     the exactly-0700 release-authority parent /var/lib/playops/release that
#     holds the private release state files (edit session, edit cleanup journal,
#     commit-attempt journal).
#
# Installing this file is an administrator action: copy it to /etc/tmpfiles.d/
# and run `systemd-tmpfiles --create`. This repository installs nothing and
# never provisions /run, /var/lib/playops or /var/log/playops itself.
d /var/lib/playops/pending 0700 playops playops-operator -
d /var/lib/playops/claims 0700 playops playops-operator -
d /var/lib/playops/write-intents 0700 playops playops-operator -
d /var/lib/playops/release 0700 playops playops-operator -
