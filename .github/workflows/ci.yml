name: CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Format check
        run: npm run format:check

      - name: Build
        run: npm run build

      - name: Test
        run: npm run test:run

      - name: Package acceptance
        run: npm run test:package

      - name: Native test (clean-dist)
        run: node --test --test-reporter=tap scripts/clean-dist.test.mjs

      - name: Native test (normalize-package-modes)
        run: node --test --test-reporter=tap scripts/normalize-package-modes.test.mjs

      - name: Native test (package-content)
        run: node --test --test-reporter=tap scripts/package-content.test.mjs

      - name: Native test (documentation-checks)
        run: node --test --test-reporter=tap scripts/documentation-checks.test.mjs

      - name: Native test (release-version)
        run: node --test --test-reporter=tap scripts/release-version.test.mjs

      - name: Production dependency audit
        run: npm audit --omit=dev

      - name: Reproducibility
        run: |
          rm -rf /tmp/pack-a /tmp/pack-b
          mkdir -p /tmp/pack-a /tmp/pack-b
          npm pack --silent --pack-destination /tmp/pack-a >/dev/null
          npm pack --silent --pack-destination /tmp/pack-b >/dev/null
          a=$(sha256sum /tmp/pack-a/*.tgz | awk '{print $1}')
          b=$(sha256sum /tmp/pack-b/*.tgz | awk '{print $1}')
          test -n "$a"
          test "$a" = "$b"
